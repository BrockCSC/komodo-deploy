name: "Komodo Ensure Action"
description: "Register or update a Komodo Action resource from a local script file."

inputs:
  komodo-host:
    required: true
  komodo-api-key:
    required: true
  komodo-api-secret:
    required: true
  action-name:
    required: true
  script-path:
    required: true
    description: "Path to the .ts file (in the caller's checkout) whose contents become file_contents."
  schedule:
    required: false
    default: ""
  schedule-format:
    required: false
    default: "English"
  schedule-enabled:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - run: npm ci --prefix "${{ github.action_path }}/.."
      shell: bash
    - run: node "${{ github.action_path }}/ensure-action.mjs"
      shell: bash
      env:
        KOMODO_HOST: ${{ inputs.komodo-host }}
        KOMODO_API_KEY: ${{ inputs.komodo-api-key }}
        KOMODO_API_SECRET: ${{ inputs.komodo-api-secret }}
        ACTION_NAME: ${{ inputs.action-name }}
        SCRIPT_PATH: ${{ inputs.script-path }}
        SCHEDULE: ${{ inputs.schedule }}
        SCHEDULE_FORMAT: ${{ inputs.schedule-format }}
        SCHEDULE_ENABLED: ${{ inputs.schedule-enabled }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
